<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <!-- Title provisional: final name pending QUESTIONS Q-001 -->
  <title>rabbit-game</title>
  <meta name="description" content="A tiny virtual-pet toy: feed the rabbit carrots, pet it, hear cute noises.">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main id="stage">
    <canvas id="scene" aria-label="Playful rabbit scene. Stroke it to pet; use the carrot to feed."></canvas>
  </main>

  <!-- HUD (v0.1): edges only; center third stays open for the rabbit (art bible §6) -->
  <h1 class="wordmark">rabbit</h1>

  <div class="hud hud-top-right">
    <button id="mute" type="button" aria-pressed="false" aria-label="Toggle sound">
      <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
        <path class="wave" d="M15 9c1.2 1.6 1.2 4.4 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="wave" d="M17.6 7c2.2 2.7 2.2 7.3 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
        <path d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="dock">
    <button id="carrot" type="button" aria-label="Feed the rabbit a carrot (or press F)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.2 21.5c-1.9.4-3.4-.8-3-2.6L8.6 7.4c.4-1.6 2-2 3.1-.9l4.9 5.4c1.2 1.3.7 3.1-1 4.4-2.6 2-5.2 4.7-7.4 5.2z" fill="#f2803c"/>
        <path d="M9.3 16.2l5.1-4M10.4 18.9l5.1-4" stroke="#d9662a" stroke-width="1" stroke-linecap="round" fill="none"/>
        <path d="M12.2 6.9c-.5-2 1-3.4 2.8-3.2-.1 1.9-.9 3-2.8 3.2z" fill="#6bbf59"/>
        <path d="M12.4 6.9c1.6-1.3 3.6-.9 4.2 1-1.8.7-3.2.3-4.2-1z" fill="#7fca70"/>
      </svg>
    </button>
    <span id="fed" class="fed-count" aria-live="polite">0 fed</span>
  </div>

  <noscript><p class="noscript-note">This toy needs JavaScript to bring the rabbit to life.</p></noscript>

  <!-- v0.1 placeholder art is code-drawn in scripts/render.js (labeled on canvas).
       Final art assets arrive via docs/design/rabbit-game/art/ pipeline in v0.2. -->
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
