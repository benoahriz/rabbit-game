<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <!-- Title: her name (Q-001 ✅ 2026-10-24 — the rabbit is Casey; repo stays rabbit-game) -->
  <title>casey</title>
  <link rel="icon" type="image/png" href="assets/character/rabbit-idle.png">
  <meta name="description" content="A tiny virtual-pet toy: feed the rabbit carrots, pet it, hear cute noises.">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main id="stage">
    <canvas id="scene" aria-label="Playful rabbit scene. Stroke it to pet; use the carrot to feed."></canvas>
  </main>

  <!-- HUD (v0.1): edges only; center third stays open for the rabbit (art bible §6) -->
  <h1 class="wordmark">casey</h1>

  <!-- Speech bubbles (IDEA-002, 2026-10-24): Casey's noises made visible; the mute channel -->
  <div id="bubbles" aria-hidden="true"></div>

  <!-- Clock & calendar (UC-7, 2026-10-24): off by default; settings Extras toggle shows them -->
  <button id="clock-chip" hidden type="button" aria-label="Show the calendar" aria-expanded="false">
    <span id="clock-time">--:--</span>
    <span id="clock-date">…</span>
  </button>
  <div id="calendar" class="calendar" hidden role="dialog" aria-label="Monthly calendar">
    <div class="cal-head">
      <button id="cal-prev" type="button" aria-label="Previous month">‹</button>
      <span id="cal-label" class="cal-title"></span>
      <button id="cal-next" type="button" aria-label="Next month">›</button>
    </div>
    <div id="cal-grid" class="cal-grid"></div>
  </div>

  <div class="hud hud-top-right">
    <!-- Corner menu button (mobile pass): phones have no ESC key; this opens/closes the settings menu -->
    <button id="menu-btn" type="button" aria-label="Open settings menu" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2.8v2.5M12 18.7v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.8 12h2.5M18.7 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="mute" type="button" aria-pressed="false" aria-label="Toggle sound">
      <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
        <path class="wave" d="M15 9c1.2 1.6 1.2 4.4 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="wave" d="M17.6 7c2.2 2.7 2.2 7.3 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
        <path d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="dock">
    <!-- Basket of carrots (v0.2): tap = feed; drag a carrot out of the basket onto the rabbit = feed -->
    <button id="basket" type="button" aria-label="Basket of carrots — tap to feed, or drag a carrot to the rabbit's mouth (or press F)">
      <svg class="basket-art" viewBox="0 0 48 42" aria-hidden="true">
        <defs>
          <g id="carrot-g">
            <path d="M24 26c-1.1 0-1.9-.7-2.1-1.9l-1.4-16.1C20.2 6.4 21.8 5 24 5s3.8 1.4 3.5 3l-1.4 16.1c-.2 1.2-1 1.9-2.1 1.9z" fill="#f2803c"/>
            <path d="M22 11.6l3-1.3M22.6 15.3l2.8-1.3" stroke="#d9662a" stroke-width="1" stroke-linecap="round" fill="none"/>
            <g transform="translate(11.8 -1.5)">
              <path d="M12.2 6.9c-.5-2 1-3.4 2.8-3.2-.1 1.9-.9 3-2.8 3.2z" fill="#6bbf59"/>
              <path d="M12.4 6.9c1.6-1.3 3.6-.9 4.2 1-1.8.7-3.2.3-4.2-1z" fill="#7fca70"/>
            </g>
          </g>
        </defs>
        <use class="carrot c-left" href="#carrot-g" transform="rotate(-22 24 26)"/>
        <use class="carrot c-mid" href="#carrot-g"/>
        <use class="carrot c-right" href="#carrot-g" transform="rotate(22 24 26)"/>
        <path d="M9 21h30c.8 7-2 16-7.5 16h-15C11 37 8.2 28 9 21z" fill="#c98b5f" stroke="#8a5a38" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 27.5c8 2.4 16 2.4 24 0M12.5 32c7.5 2.2 15.5 2.2 23 0" stroke="#a86d44" stroke-width="1.2" fill="none" opacity=".8"/>
        <path d="M18 22.5l-.8 13M24 23v13M30 22.5l.8 13" stroke="#a86d44" stroke-width="1.1" opacity=".55"/>
        <rect x="6.5" y="17.5" width="35" height="5" rx="2.5" fill="#b07a4e" stroke="#8a5a38" stroke-width="1.4"/>
      </svg>
    </button>
    <span id="fed" class="fed-count" aria-live="polite">0 fed</span>
  </div>

  <!-- Settings menu (v0.2): ESC toggles; picking the Setting swaps the environment art -->
  <div id="menu" class="menu" hidden role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="menu-card">
      <h2 id="menu-title">Settings</h2>
      <p class="menu-hint">tap outside, tap the corner button, or press esc to close</p>
      <fieldset class="menu-row">
        <legend>Setting</legend>
        <div class="setting-opts">
          <button id="opt-garden" class="setting-opt" type="button" data-setting="garden" aria-pressed="false">Garden <small>(outside)</small></button>
          <button id="opt-room" class="setting-opt" type="button" data-setting="room" aria-pressed="false">Pink room <small>(inside)</small></button>
        </div>
      </fieldset>
      <fieldset class="menu-row">
        <legend>Extras</legend>
        <div class="setting-opts">
          <button id="opt-clock" class="extra-opt" type="button" aria-pressed="false">Clock &amp; calendar <small>(local time + month view)</small></button>
        </div>
      </fieldset>
    </div>
  </div>

  <noscript><p class="noscript-note">This toy needs JavaScript to bring the rabbit to life.</p></noscript>

  <!-- v0.1 placeholder art is code-drawn in scripts/render.js (labeled on canvas).
       Final art assets arrive via docs/design/rabbit-game/art/ pipeline in v0.2. -->
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
